[project]
name = "manas-backend"
version = "0.1.0"
description = "Manas: a living brain for every customer. Cited facts, checked beliefs, simulated reactions, traceable decisions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "anthropic>=0.75",
    "openpyxl>=3.1.5",
    "mcp>=2.3.0",
    "httpx>=0.29.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
